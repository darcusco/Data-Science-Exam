<!DOCTYPE html>
<html lang="hr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="theme-color" content="#0a0e0a">
<title>sudo maso</title>
<style>
  :root {
    --bg: #0a0e0a;
    --panel: #0e140e;
    --panel2: #101a10;
    --green: #33ff66;
    --green-dim: #1fa344;
    --green-dark: #114422;
    --amber: #ffb000;
    --red: #ff4455;
    --cyan: #44ddff;
    --text: #b8e6c0;
    --glow: 0 0 8px rgba(51, 255, 102, 0.45);
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  html, body {
    height: 100%;
    background: var(--bg);
    color: var(--text);
    font-family: "Courier New", ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
    overflow: hidden;
    -webkit-tap-highlight-color: transparent;
    touch-action: manipulation;
    user-select: none;
    -webkit-user-select: none;
  }

  /* ---------- CRT efekt ---------- */
  body::before {
    content: "";
    position: fixed; inset: 0;
    background: repeating-linear-gradient(
      0deg,
      rgba(0,0,0,0.18) 0px,
      rgba(0,0,0,0.18) 1px,
      transparent 1px,
      transparent 3px
    );
    pointer-events: none;
    z-index: 100;
  }
  body::after {
    content: "";
    position: fixed; inset: 0;
    background: radial-gradient(ellipse at center, transparent 55%, rgba(0,0,0,0.55) 100%);
    pointer-events: none;
    z-index: 101;
  }

  @keyframes flicker {
    0%, 100% { opacity: 1; }
    97% { opacity: 1; }
    98% { opacity: 0.92; }
    99% { opacity: 0.98; }
  }

  #app {
    height: 100%;
    height: 100dvh;
    display: flex;
    flex-direction: column;
    max-width: 560px;
    margin: 0 auto;
    padding: 10px;
    gap: 10px;
    animation: flicker 6s infinite;
  }

  /* ---------- Header ---------- */
  header {
    border: 1px solid var(--green-dark);
    border-radius: 8px;
    background: linear-gradient(180deg, var(--panel2), var(--panel));
    padding: 10px 14px;
    box-shadow: inset 0 0 24px rgba(51,255,102,0.05);
  }
  .titlebar {
    display: flex;
    align-items: center;
    justify-content: space-between;
  }
  h1 {
    font-size: 1.15rem;
    color: var(--green);
    text-shadow: var(--glow);
    letter-spacing: 2px;
    font-weight: bold;
  }
  h1 .cursor {
    display: inline-block;
    width: 0.6em; height: 1.05em;
    background: var(--green);
    vertical-align: text-bottom;
    margin-left: 3px;
    animation: blink 1s steps(1) infinite;
  }
  @keyframes blink { 50% { opacity: 0; } }
  .ver { font-size: 0.65rem; color: var(--green-dim); }

  .stats {
    display: flex;
    justify-content: space-between;
    margin-top: 8px;
    font-size: 0.78rem;
    gap: 8px;
  }
  .stat b {
    display: block;
    color: var(--green);
    font-size: 1.05rem;
    text-shadow: var(--glow);
  }
  .stat span { color: var(--green-dim); font-size: 0.62rem; letter-spacing: 1px; }
  .stat { text-align: center; flex: 1; }

  /* ---------- Bol (pain) meter ---------- */
  .painwrap {
    margin-top: 8px;
    font-size: 0.62rem;
    color: var(--red);
    letter-spacing: 1px;
  }
  .painbar {
    height: 7px;
    border: 1px solid #552233;
    border-radius: 4px;
    margin-top: 3px;
    overflow: hidden;
    background: rgba(255,68,85,0.06);
  }
  .painfill {
    height: 100%;
    width: 0%;
    background: linear-gradient(90deg, #aa2233, var(--red));
    box-shadow: 0 0 10px rgba(255,68,85,0.7);
    transition: width 0.25s ease;
  }
  .frenzy .painfill { background: linear-gradient(90deg, var(--amber), #fff066); }
  .frenzy .painwrap { color: var(--amber); }

  /* ---------- Terminal log ---------- */
  #term {
    flex: 1;
    min-height: 70px;
    border: 1px solid var(--green-dark);
    border-radius: 8px;
    background: var(--panel);
    padding: 10px 12px;
    overflow-y: auto;
    font-size: 0.72rem;
    line-height: 1.5;
    box-shadow: inset 0 0 30px rgba(0,0,0,0.5);
  }
  #term .ln { white-space: pre-wrap; word-break: break-word; }
  #term .c-cmd { color: var(--green); }
  #term .c-ok { color: var(--text); }
  #term .c-err { color: var(--red); }
  #term .c-sys { color: var(--cyan); }
  #term .c-gold { color: var(--amber); text-shadow: 0 0 6px rgba(255,176,0,0.5); }

  /* ---------- Glavni gumb ---------- */
  #clicker {
    width: 100%;
    padding: 18px 10px;
    font-family: inherit;
    font-size: 1.05rem;
    font-weight: bold;
    letter-spacing: 1px;
    color: var(--green);
    background: linear-gradient(180deg, #142214, #0c150c);
    border: 1px solid var(--green-dim);
    border-radius: 10px;
    cursor: pointer;
    text-shadow: var(--glow);
    box-shadow: 0 0 18px rgba(51,255,102,0.12), inset 0 0 14px rgba(51,255,102,0.06);
    transition: transform 0.05s ease;
  }
  #clicker:active { transform: scale(0.97); }
  #clicker small {
    display: block;
    font-size: 0.62rem;
    color: var(--green-dim);
    font-weight: normal;
    margin-top: 4px;
    letter-spacing: 0;
  }
  .frenzy #clicker {
    color: var(--amber);
    border-color: var(--amber);
    text-shadow: 0 0 10px rgba(255,176,0,0.8);
    box-shadow: 0 0 26px rgba(255,176,0,0.35);
  }

  /* ---------- Shop ---------- */
  #shop {
    max-height: 38%;
    overflow-y: auto;
    display: flex;
    flex-direction: column;
    gap: 6px;
    padding-bottom: 4px;
  }
  .item {
    display: flex;
    align-items: center;
    gap: 10px;
    width: 100%;
    text-align: left;
    font-family: inherit;
    background: linear-gradient(180deg, var(--panel2), var(--panel));
    border: 1px solid var(--green-dark);
    border-radius: 8px;
    padding: 9px 12px;
    color: var(--text);
    cursor: pointer;
    transition: border-color 0.15s, opacity 0.15s;
  }
  .item:active { transform: scale(0.99); }
  .item:disabled { opacity: 0.38; cursor: default; }
  .item.affordable { border-color: var(--green-dim); }
  .item .ico { font-size: 1.25rem; width: 30px; text-align: center; flex-shrink: 0; }
  .item .info { flex: 1; min-width: 0; }
  .item .nm { color: var(--green); font-size: 0.8rem; font-weight: bold; }
  .item .ds { color: var(--green-dim); font-size: 0.62rem; }
  .item .right { text-align: right; flex-shrink: 0; }
  .item .cost { color: var(--amber); font-size: 0.78rem; font-weight: bold; }
  .item .owned { color: var(--green-dim); font-size: 0.62rem; }

  /* plutajući brojevi */
  .float {
    position: fixed;
    color: var(--green);
    font-weight: bold;
    font-size: 0.95rem;
    text-shadow: var(--glow);
    pointer-events: none;
    z-index: 50;
    animation: floatup 0.9s ease-out forwards;
  }
  .float.bad { color: var(--red); text-shadow: 0 0 8px rgba(255,68,85,0.6); }
  .float.gold { color: var(--amber); text-shadow: 0 0 8px rgba(255,176,0,0.7); }
  @keyframes floatup {
    from { transform: translateY(0); opacity: 1; }
    to { transform: translateY(-55px); opacity: 0; }
  }

  ::-webkit-scrollbar { width: 5px; }
  ::-webkit-scrollbar-thumb { background: var(--green-dark); border-radius: 3px; }
</style>
</head>
<body>
<div id="app">
  <header>
    <div class="titlebar">
      <h1>sudo maso<span class="cursor"></span></h1>
      <span class="ver">tty1 &middot; v1.0</span>
    </div>
    <div class="stats">
      <div class="stat"><b id="s-pts">0</b><span>ROOT PTS</span></div>
      <div class="stat"><b id="s-ps">0/s</b><span>PASIVNO</span></div>
      <div class="stat"><b id="s-pc">1</b><span>PO KLIKU</span></div>
    </div>
    <div class="painwrap">
      <span id="painlabel">BOL [permission denied streak]</span>
      <div class="painbar"><div class="painfill" id="painfill"></div></div>
    </div>
  </header>

  <div id="term"></div>

  <button id="clicker">
    $ sudo maso
    <small>tapni za root pristup</small>
  </button>

  <div id="shop"></div>
</div>

<script>
"use strict";

/* ---------------- podaci ---------------- */
const GENS = [
  { id:"cron",   ico:"⏱",  nm:"cron job",      ds:"* * * * * ./maso.sh", base:15,     rate:0.1 },
  { id:"zombie", ico:"🧟", nm:"zombie proces",  ds:"defunct, ali radi",   base:100,    rate:1 },
  { id:"daemon", ico:"👹", nm:"daemon",         ds:"masod --force",       base:1100,   rate:8 },
  { id:"botnet", ico:"🕸",  nm:"botnet",        ds:"10k zaraženih tostera", base:12000, rate:47 },
  { id:"kernel", ico:"🧠", nm:"kernel modul",   ds:"insmod bol.ko",       base:130000, rate:260 },
  { id:"skynet", ico:"🛰",  nm:"skynet.ai",     ds:"rm -rf /covjecanstvo", base:1.4e6, rate:1400 },
];

const CLICKS = [
  { id:"c1", ico:"🔑", nm:"sudo -i",     ds:"klik ×2",  cost:100 },
  { id:"c2", ico:"⚙",  nm:"setuid bit",  ds:"klik ×2",  cost:600 },
  { id:"c3", ico:"💀", nm:"root shell",  ds:"klik ×2",  cost:3500 },
  { id:"c4", ico:"👁",  nm:"uid=0",      ds:"klik ×2",  cost:20000 },
  { id:"c5", ico:"⚡", nm:"god mode",    ds:"klik ×2",  cost:120000 },
];

const DENIED_MSGS = [
  "sudo: maso: Permission denied",
  "sudo: 3 incorrect password attempts",
  "bash: maso: command not found... bolno.",
  "sudo: a password is required",
  "[sudo] password for maso: ********  ✗",
];
const OK_MSGS = [
  "access granted.",
  "uid=0(root) gid=0(root)",
  "# whoami → root",
  "privilege escalated.",
  "kernel se ne buni. zasad.",
];

/* ---------------- stanje ---------------- */
const SAVE_KEY = "sudo_maso_save_v1";
let S = {
  pts: 0, total: 0,
  clickLvl: 0,
  gens: {}, clicks: {},
  pain: 0,
  frenzyUntil: 0,
  last: Date.now(),
};
GENS.forEach(g => S.gens[g.id] = 0);

function load() {
  try {
    const raw = localStorage.getItem(SAVE_KEY);
    if (!raw) return;
    const d = JSON.parse(raw);
    Object.assign(S, d);
    GENS.forEach(g => { if (!(g.id in S.gens)) S.gens[g.id] = 0; });
    // offline zarada (max 8h)
    const away = Math.min((Date.now() - S.last) / 1000, 8 * 3600);
    if (away > 30) {
      const earned = perSec() * away;
      if (earned > 0) {
        S.pts += earned; S.total += earned;
        setTimeout(() => log(`[offline] dok te nije bilo: +${fmt(earned)} root pts`, "c-gold"), 600);
      }
    }
  } catch (e) {}
}
function save() {
  S.last = Date.now();
  try { localStorage.setItem(SAVE_KEY, JSON.stringify(S)); } catch (e) {}
}

/* ---------------- pomoćno ---------------- */
function fmt(n) {
  if (n < 1000) return (Math.floor(n * 10) / 10).toString().replace(/\.0$/, "");
  const u = ["K","M","B","T","Qa"];
  let i = -1;
  while (n >= 1000 && i < u.length - 1) { n /= 1000; i++; }
  return n.toFixed(n < 100 ? 1 : 0) + u[i];
}
function genCost(g) { return Math.ceil(g.base * Math.pow(1.15, S.gens[g.id])); }
function perClick() {
  let p = 1 * Math.pow(2, Object.keys(S.clicks).length);
  if (Date.now() < S.frenzyUntil) p *= 10;
  return p;
}
function perSec() {
  let p = GENS.reduce((a, g) => a + g.rate * S.gens[g.id], 0);
  if (Date.now() < S.frenzyUntil) p *= 10;
  return p;
}

/* ---------------- terminal ---------------- */
const term = document.getElementById("term");
function log(txt, cls = "c-ok") {
  const el = document.createElement("div");
  el.className = "ln " + cls;
  el.textContent = txt;
  term.appendChild(el);
  while (term.children.length > 60) term.removeChild(term.firstChild);
  term.scrollTop = term.scrollHeight;
}

function floatNum(x, y, txt, cls = "") {
  const el = document.createElement("div");
  el.className = "float " + cls;
  el.textContent = txt;
  el.style.left = (x - 20 + (Math.random() * 30 - 15)) + "px";
  el.style.top = (y - 30) + "px";
  document.body.appendChild(el);
  setTimeout(() => el.remove(), 900);
}

/* ---------------- klik ---------------- */
const PAIN_MAX = 10;
function doClick(x, y) {
  const frenzy = Date.now() < S.frenzyUntil;
  // maso mehanika: 18% šanse za "permission denied" → raste BOL
  if (!frenzy && Math.random() < 0.18) {
    S.pain++;
    log("$ sudo maso", "c-cmd");
    log(DENIED_MSGS[Math.floor(Math.random() * DENIED_MSGS.length)], "c-err");
    floatNum(x, y, "DENIED", "bad");
    if (S.pain >= PAIN_MAX) {
      S.pain = 0;
      S.frenzyUntil = Date.now() + 10000;
      log("══════ BOL JE UŽITAK ══════", "c-gold");
      log("FRENZY: sve ×10 na 10 sekundi!", "c-gold");
      floatNum(x, y, "×10 FRENZY!", "gold");
    }
  } else {
    const gain = perClick();
    S.pts += gain; S.total += gain;
    if (Math.random() < 0.25) {
      log("$ sudo maso", "c-cmd");
      log(OK_MSGS[Math.floor(Math.random() * OK_MSGS.length)], "c-ok");
    }
    floatNum(x, y, "+" + fmt(gain), frenzy ? "gold" : "");
  }
  render();
}

const clicker = document.getElementById("clicker");
clicker.addEventListener("pointerdown", (e) => {
  e.preventDefault();
  doClick(e.clientX, e.clientY);
});

/* ---------------- shop ---------------- */
const shop = document.getElementById("shop");
const itemEls = {};

function buildShop() {
  GENS.forEach(g => {
    const b = document.createElement("button");
    b.className = "item";
    b.innerHTML = `<span class="ico">${g.ico}</span>
      <span class="info"><span class="nm">${g.nm}</span><br><span class="ds">${g.ds} &middot; +${g.rate}/s</span></span>
      <span class="right"><span class="cost"></span><br><span class="owned"></span></span>`;
    b.addEventListener("pointerdown", (e) => {
      e.preventDefault();
      const c = genCost(g);
      if (S.pts >= c) {
        S.pts -= c;
        S.gens[g.id]++;
        log(`# apt install ${g.nm.replace(/ /g, "-")} ... OK (${S.gens[g.id]}x)`, "c-sys");
        render(); save();
      }
    });
    shop.appendChild(b);
    itemEls[g.id] = b;
  });

  CLICKS.forEach(c => {
    const b = document.createElement("button");
    b.className = "item";
    b.innerHTML = `<span class="ico">${c.ico}</span>
      <span class="info"><span class="nm">${c.nm}</span><br><span class="ds">${c.ds}</span></span>
      <span class="right"><span class="cost"></span><br><span class="owned">jednokratno</span></span>`;
    b.addEventListener("pointerdown", (e) => {
      e.preventDefault();
      if (!S.clicks[c.id] && S.pts >= c.cost) {
        S.pts -= c.cost;
        S.clicks[c.id] = true;
        log(`# chmod +s ${c.nm} → klik snaga ×2`, "c-gold");
        render(); save();
      }
    });
    shop.appendChild(b);
    itemEls[c.id] = b;
  });
}

/* ---------------- render ---------------- */
const elPts = document.getElementById("s-pts");
const elPs = document.getElementById("s-ps");
const elPc = document.getElementById("s-pc");
const elPain = document.getElementById("painfill");
const elPainLabel = document.getElementById("painlabel");
const app = document.getElementById("app");

function render() {
  const frenzy = Date.now() < S.frenzyUntil;
  app.classList.toggle("frenzy", frenzy);
  elPts.textContent = fmt(S.pts);
  elPs.textContent = fmt(perSec()) + "/s";
  elPc.textContent = fmt(perClick());
  if (frenzy) {
    const left = Math.ceil((S.frenzyUntil - Date.now()) / 1000);
    elPainLabel.textContent = `FRENZY ×10 — još ${left}s`;
    elPain.style.width = (left / 10 * 100) + "%";
  } else {
    elPainLabel.textContent = "BOL [permission denied streak]";
    elPain.style.width = (S.pain / PAIN_MAX * 100) + "%";
  }

  GENS.forEach(g => {
    const b = itemEls[g.id];
    const c = genCost(g);
    b.querySelector(".cost").textContent = fmt(c);
    b.querySelector(".owned").textContent = S.gens[g.id] + "x";
    b.disabled = S.pts < c;
    b.classList.toggle("affordable", S.pts >= c);
  });
  CLICKS.forEach(c => {
    const b = itemEls[c.id];
    if (S.clicks[c.id]) {
      b.querySelector(".cost").textContent = "✓";
      b.disabled = true;
      b.classList.remove("affordable");
    } else {
      b.querySelector(".cost").textContent = fmt(c.cost);
      b.disabled = S.pts < c.cost;
      b.classList.toggle("affordable", S.pts >= c.cost);
    }
  });
}

/* ---------------- petlja ---------------- */
let lastTick = Date.now();
setInterval(() => {
  const now = Date.now();
  const dt = (now - lastTick) / 1000;
  lastTick = now;
  const gain = perSec() * dt;
  if (gain > 0) { S.pts += gain; S.total += gain; }
  render();
}, 250);

setInterval(save, 10000);
document.addEventListener("visibilitychange", () => { if (document.hidden) save(); });
window.addEventListener("pagehide", save);

/* ---------------- boot ---------------- */
load();
buildShop();
render();

const BOOT = [
  ["sudo-maso v1.0 — login: maso", "c-sys"],
  ["[sudo] password for maso: ********", "c-ok"],
  ["Pristup odbijen. Ali ti se to sviđa.", "c-err"],
  ["Tapni '$ sudo maso' i skupljaj root pts.", "c-sys"],
  ["Tip: 'permission denied' puni BOL metar → FRENZY ×10.", "c-sys"],
];
BOOT.forEach((l, i) => setTimeout(() => log(l[0], l[1]), 300 + i * 350));
</script>
</body>
</html>
